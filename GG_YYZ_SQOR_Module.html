<style>
:root{
  --gg:#48AF44;--gg-dk:#2E7D32;--navy:#1A3A6B;--dark:#1C2331;
  --safe:#2EA043;--nr:#D29922;--atrisk:#DA3633;
  --white:#fff;--lgray:#F4F5F7;--border:#E0E4EA;--mid:#777;--black:#111;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:15px;background:var(--dark)}

/* ── APPBAR ─────────────────────────────────────────── */
.appbar{background:var(--dark);padding:0 14px;height:52px;display:flex;align-items:center;gap:10px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.1)}
.appbar-logo{width:34px;height:34px;border-radius:8px;overflow:hidden;flex-shrink:0}
.appbar-logo img{width:100%;height:100%;object-fit:cover}
.appbar-title{flex:1}
.appbar-title .t{font-size:14px;font-weight:700;color:#fff}
.appbar-title .s{font-size:10px;color:rgba(255,255,255,.4)}
.approach-toggle{display:flex;gap:4px;background:rgba(255,255,255,.08);border-radius:8px;padding:3px}
.at-btn{background:transparent;border:none;color:rgba(255,255,255,.5);font-size:11px;font-weight:700;padding:5px 10px;border-radius:6px;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
.at-btn.active{background:var(--gg);color:#fff}

/* ── PROGRESS BAR ───────────────────────────────────── */
.pbar{height:3px;background:rgba(255,255,255,.08);flex-shrink:0}
.pbar-fill{height:100%;background:var(--gg);transition:width .3s}

/* ── HEADER FORM ────────────────────────────────────── */
.hdr-form{background:var(--dark);padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.hdr-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.hf{display:flex;flex-direction:column;gap:3px}
.hf label{font-size:9px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.05em}
.hf input,.hf select{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:7px 10px;font-size:13px;font-family:inherit;color:#fff;outline:none;-webkit-appearance:none}
.hf input:focus,.hf select:focus{border-color:var(--gg)}
.hf input::placeholder{color:rgba(255,255,255,.2)}
.hf select option{background:var(--dark)}

/* ── STATS STRIP ────────────────────────────────────── */
.stats-strip{background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.08);padding:8px 14px;display:flex;gap:12px;flex-shrink:0}
.stat-item{text-align:center;flex:1}
.stat-val{font-size:20px;font-weight:900;line-height:1}
.stat-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.stat-safe{color:var(--safe)}
.stat-nr{color:var(--nr)}
.stat-ar{color:var(--atrisk)}
.stat-pct{color:#fff}
.stat-pct .stat-val{font-size:22px}

/* ── SCROLL ─────────────────────────────────────────── */
.checklist-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#EAEEF3;padding-bottom:80px}

/* ── CATEGORY HEADER ────────────────────────────────── */
.cat-hdr{position:sticky;top:0;z-index:10;background:var(--navy);padding:7px 14px;display:flex;align-items:center;justify-content:space-between}
.cat-hdr .ch-title{font-size:11px;font-weight:900;color:#fff;text-transform:uppercase;letter-spacing:.07em}
.cat-hdr .ch-prog{font-size:11px;color:rgba(255,255,255,.4)}
.cat-hdr .ch-prog.done{color:var(--gg)}

/* ── CHECKLIST ITEM ─────────────────────────────────── */
.ci{background:#fff;border-bottom:1px solid #eee;padding:10px 12px}
.ci-desc{font-size:13px;font-weight:600;color:var(--black);line-height:1.35;margin-bottom:8px;flex:1}
.ci-btns{display:flex;gap:6px;margin-bottom:0}
.ci-btn{flex:1;border:none;border-radius:7px;padding:9px 4px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent;transition:all .15s;opacity:.45}
.ci-btn.selected{opacity:1}
.ci-btn.btn-safe{background:rgba(46,160,67,.15);color:var(--safe)}
.ci-btn.btn-safe.selected{background:var(--safe);color:#fff}
.ci-btn.btn-nr{background:rgba(210,153,34,.15);color:var(--nr)}
.ci-btn.btn-nr.selected{background:var(--nr);color:#fff}
.ci-btn.btn-ar{background:rgba(218,54,51,.15);color:var(--atrisk)}
.ci-btn.btn-ar.selected{background:var(--atrisk);color:#fff}
.ci-btn.btn-na{background:rgba(120,120,140,.12);color:rgba(150,150,170,.7)}
.ci-btn.btn-na.selected{background:#556;color:#fff}
.ci.na{background:#F8F8FA;opacity:.7}
.ci-comment{display:none;margin-top:8px}
.ci-comment textarea{width:100%;background:var(--lgray);border:1.5px solid var(--atrisk);border-radius:7px;padding:8px 10px;font-size:13px;font-family:inherit;color:var(--black);outline:none;resize:none;min-height:60px}
.ci-comment textarea:focus{background:#fff}
.ci.ar .ci-comment{display:block}
.ci.safe{background:#FAFFFE}
.ci.nr{background:#FFFDF0}
.ci.ar{background:#FFF5F5;border-left:3px solid var(--atrisk)}

/* ── FOOTER FORM ────────────────────────────────────── */
.footer-form{background:#fff;padding:12px;border-top:1px solid var(--border)}
.ff-row{display:flex;gap:8px;margin-bottom:8px}
.ff-row .field{flex:1}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:10px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.04em}
.field input,.field select,.field textarea{background:var(--lgray);border:1.5px solid transparent;border-radius:7px;padding:9px 11px;font-size:13px;font-family:inherit;color:var(--black);outline:none;-webkit-appearance:none}
.field input:focus,.field select:focus{border-color:var(--gg)}
.pill-group{display:flex;gap:6px}
.pill-group input[type=radio]{display:none}
.pill-group label{flex:1;text-align:center;padding:9px;border-radius:7px;border:1.5px solid #ccc;font-size:13px;font-weight:600;color:var(--mid);cursor:pointer;background:var(--lgray)}
.pill-group input[type=radio]:checked+label{background:var(--gg);border-color:var(--gg);color:#fff}

/* ── BOTTOM BAR ─────────────────────────────────────── */
.bottom-bar{flex-shrink:0;background:#fff;border-top:1px solid var(--border);padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.btn-reset{flex:1;background:var(--lgray);color:var(--black);border:1.5px solid #ccc;border-radius:8px;padding:12px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
.btn-archive{flex:2;background:var(--gg);color:#fff;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
.btn-pdf{flex:1.5;background:var(--navy);color:#fff;border:none;border-radius:8px;padding:12px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}

/* ── ARCHIVE MODAL ──────────────────────────────────── */
#archiveModal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:700;display:none;align-items:flex-end;backdrop-filter:blur(4px)}
#archiveModal.show{display:flex}
.arc-sheet{background:#EAEEF3;border-radius:20px 20px 0 0;width:100%;max-height:80vh;overflow-y:auto;animation:slideUp .3s cubic-bezier(.4,0,.2,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.arc-hdr{padding:14px 16px;background:var(--navy);border-radius:20px 20px 0 0;display:flex;align-items:center;justify-content:space-between}
.arc-hdr span{font-size:15px;font-weight:700;color:#fff}
.arc-close{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:8px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer}
.arc-row{display:flex;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--border);font-size:13px}
.arc-row .ar-lbl{font-weight:700;color:var(--navy)}
.arc-row .ar-val{color:#444}
.arc-atrisk-list{padding:12px 14px}
.arc-ar-item{background:#FFEBEE;border-left:3px solid var(--atrisk);border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:12px}
.arc-ar-item .aai-lbl{font-weight:700;color:var(--atrisk);margin-bottom:2px}
.arc-ar-item .aai-comment{color:#555;font-style:italic}
.arc-btns{padding:12px 14px 28px;display:flex;gap:8px}

/* toast */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--dark);color:#fff;padding:10px 22px;border-radius:20px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:all .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* VIEW structure */
#app{display:flex;flex-direction:column;height:100%;overflow:hidden}

/* ── SUITE BACK BUTTON ───────────────────────────── */
.suite-back{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));
  right:16px;z-index:9000;background:rgba(28,35,49,.92);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:50px;
  padding:10px 18px 10px 14px;font-size:13px;font-weight:700;
  font-family:inherit;cursor:pointer;display:flex;align-items:center;
  gap:7px;box-shadow:0 4px 20px rgba(0,0,0,.4);
  -webkit-tap-highlight-color:transparent;transition:opacity .15s}
.suite-back:active{opacity:.7}
.suite-back .sb-arrow{font-size:16px;line-height:1}
.suite-back .sb-label{font-size:12px;color:rgba(255,255,255,.7);letter-spacing:.02em}

/* ── GALLEY SELECTOR ─────────────────────────────────── */
.galley-strip{background:var(--dark);padding:7px 12px 8px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;display:flex;align-items:center;gap:8px}
.galley-lbl{font-size:10px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.galley-pills{display:flex;gap:5px;flex:1}
.gp{flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:7px;padding:7px 4px;font-size:12px;font-weight:700;color:rgba(255,255,255,.45);cursor:pointer;font-family:inherit;text-align:center;-webkit-tap-highlight-color:transparent;transition:all .15s}
.gp.active{background:var(--gg);border-color:var(--gg);color:#fff}

/* ── COLLAPSIBLE FOOTER ───────────────────────────────── */
.footer-trigger{display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent;
  border-top:1px solid var(--border);background:#fff}
.ft-summary{font-size:12px;color:var(--mid);font-style:italic}
.ft-summary strong{color:var(--dark);font-style:normal}
.ft-chevron{font-size:12px;color:var(--mid);transition:transform .25s}
.footer-form.collapsed .ft-chevron{transform:rotate(180deg)}
.footer-inner{padding:12px 14px 0;display:block}
.footer-form.collapsed .footer-inner{display:none}

/* ── STEP DESCRIPTION ─────────────────────────────────── */
.ci-info{background:none;border:none;color:rgba(100,120,160,.6);font-size:13px;
  cursor:pointer;padding:0 4px;flex-shrink:0;-webkit-tap-highlight-color:transparent;
  line-height:1;vertical-align:middle}
.ci-info:active{color:var(--gg)}
.ci-full-desc{display:none;font-size:11.5px;color:rgba(60,80,100,.8);
  line-height:1.55;margin-top:6px;padding:8px 10px;background:rgba(72,175,68,.06);
  border-left:3px solid var(--gg);border-radius:0 6px 6px 0}
.ci-full-desc.show{display:block}
.ci-header{display:flex;align-items:flex-start;gap:4px}
.ci-header .ci-desc{flex:1}


.qr-scan-row{display:flex;gap:6px;margin-top:6px}
.qr-scan-btn{flex:1;background:rgba(72,175,68,.1);border:1px solid rgba(72,175,68,.25);
  color:var(--gg);border-radius:7px;padding:9px 10px;font-size:12px;font-weight:700;
  cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;
  gap:6px;-webkit-tap-highlight-color:transparent;transition:background .15s}
.qr-scan-btn:active{background:rgba(72,175,68,.3)}
.hf.full-width{grid-column:1/-1}

</style>

</head>

// ══ QR SCANNER ═══════════════════════════════════════════════
let qrTargetField = 'driver';
let qrParsed      = null;

function openQR(field) {
  qrTargetField = field || 'driver';
  qrParsed = null;
  // Check BarcodeDetector support
  if (!('BarcodeDetector' in window)) {
    showToast('⚠ QR scanning requires Android Chrome 83+');
    return;
  }
  // Trigger hidden file input — opens camera on Android
  const input = document.getElementById('qr_cam_input');
  if (input) { input.value = ''; input.click(); }
}

async function handleQRImage(input) {
  if (!input.files || !input.files[0]) return;
  try {
    showToast('📷 Reading QR code...');
    const img  = await createImageBitmap(input.files[0]);
    const det  = new BarcodeDetector({ formats: ['qr_code'] });
    const hits = await det.detect(img);
    if (!hits.length) {
      showToast('No QR code found — try again with better lighting');
      return;
    }
    processQRData(hits[0].rawValue);
  } catch(e) {
    showToast('⚠ Could not read image: ' + e.message);
  }
}

function processQRData(raw) {
  const trimmed = raw.trim();
  let parsed = { name:'', employee_id:'', role:'', raw:trimmed, _method:'' };

  // Attempt 1: JSON
  try {
    const j = JSON.parse(trimmed);
    parsed.name        = j.name||j.Name||j.fullName||j.full_name||j.employee_name||'';
    parsed.employee_id = j.id||j.ID||j.employee_id||j.employeeId||j.badge||'';
    parsed.role        = j.role||j.Role||j.title||j.position||'';
    parsed._method = 'JSON';
  } catch(e) {
    // Attempt 2: MDC format  000125560,ROBERT CHRIS,NA.,HEINBACH
    const parts = trimmed.split(',').map(s=>s.trim());
    if (parts.length >= 2 && /^\d{4,}$/.test(parts[0])) {
      parsed.employee_id = parts[0];
      const nameParts = parts.slice(1).filter(p=>p!=='NA.'&&p!=='N.A.'&&p.length>1);
      parsed.name = nameParts.join(' ').trim();
      parsed._method = 'MDC-format';
    }
    // Attempt 3: pipe-delimited
    else if (trimmed.includes('|')) {
      const p = trimmed.split('|').map(s=>s.trim());
      if (/^\d+$/.test(p[0])) {
        parsed.employee_id=p[0]; parsed.name=p[1]||''; parsed.role=p[2]||'';
      } else {
        parsed.name=p[0]; parsed.employee_id=p[1]||''; parsed.role=p[2]||'';
      }
      parsed._method = 'pipe-delimited';
    }
    // Attempt 4: comma name,id
    else if (trimmed.includes(',')) {
      const p = trimmed.split(',').map(s=>s.trim());
      if (/^\d+$/.test(p[0])) {
        parsed.employee_id=p[0]; parsed.name=p[1]||''; parsed.role=p[2]||'';
      } else {
        parsed.name=p[0]; parsed.employee_id=p[1]||''; parsed.role=p[2]||'';
      }
      parsed._method = 'comma-delimited';
    }
    // Fallback
    else {
      parsed.name = trimmed.slice(0,60);
      parsed._method = 'raw';
    }
  }
  qrParsed = parsed;
  showQRResult(parsed);
}

function showQRResult(parsed) {
  const rows = [
    ['Name',          parsed.name        || '—'],
    ['Employee ID',   parsed.employee_id || '—'],
    ['Role / Title',  parsed.role        || '—'],
    ['Target Field',  qrTargetField === 'driver' ? 'Driver Name' : 'Guide Name'],
    ['Parse Method',  parsed._method],
  ];
  document.getElementById('qr_result_rows').innerHTML = rows.map(([l,v])=>
    `<div style="display:flex;justify-content:space-between;padding:10px 16px;
      border-bottom:1px solid #E0E4EA;font-size:13px">
      <span style="font-weight:700;color:#1A3A6B;min-width:110px">${l}</span>
      <span style="color:#111;font-weight:600;text-align:right">${v}</span>
    </div>`
  ).join('');
  const rawWrap = document.getElementById('qr_raw_wrap');
  if (parsed._method === 'raw') {
    rawWrap.style.display = 'block';
    document.getElementById('qr_raw_text').textContent = parsed.raw;
  } else {
    rawWrap.style.display = 'none';
  }
  document.getElementById('qrResultModal').style.display = 'flex';
}

function closeQRResult() {
  document.getElementById('qrResultModal').style.display = 'none';
  qrParsed = null;
}

function applyQRResult() {
  if (!qrParsed) return;
  const formatted = formatName(qrParsed.name);
  const field = qrTargetField === 'driver' ? 'h_driver' : 'h_guide';
  const el = document.getElementById(field);
  if (el) el.value = formatted;
  window._driverEmployeeId = qrTargetField==='driver' ? qrParsed.employee_id : window._driverEmployeeId;
  window._guideEmployeeId  = qrTargetField==='guide'  ? qrParsed.employee_id : window._guideEmployeeId;
  closeQRResult();
  showToast('✅ ' + (qrTargetField==='driver'?'Driver':'Guide') + ': ' + formatted);
}

function formatName(raw) {
  if (!raw) return '';
  if (raw === raw.toUpperCase() && raw.includes(' '))
    return raw.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
  return raw;
}

// ══ APPROACH ══════════════════════════════════════════
function setApproach(type) {
  currentApproach = type;
  results = {};
  document.getElementById('btn_one').classList.toggle('active', type==='one');
  document.getElementById('btn_two').classList.toggle('active', type==='two');
  document.getElementById('guide_row').style.display = type==='two' ? '' : 'none';
  renderChecklist();
  updateStats();
}

// ══ RENDER CHECKLIST ══════════════════════════════════
function renderChecklist() {
  const items = currentApproach === 'one' ? ONE_ITEMS : TWO_ITEMS;
  const scroll = document.getElementById('checklist_scroll');
  
  // Group by category
  const grouped = {};
  items.forEach(it => {
    if (!grouped[it.cat]) grouped[it.cat] = [];
    grouped[it.cat].push(it);
  });

  let html = '';
  Object.entries(grouped).forEach(([cat, catItems]) => {
    const [icon, label] = CAT_LABELS[cat] || ['•', cat];
    html += `<div class="cat-hdr" id="cath_${cat}">
      <div class="ch-title">${icon} ${label}</div>
      <div class="ch-prog" id="catp_${cat}">0/${catItems.length}</div>
    </div>`;
    catItems.forEach(it => {
      const r = results[it.id];
      const cls = r ? r.result : '';
      html += `<div class="ci ${cls}" id="ci_${it.id}">
        <div class="ci-header">
          <div class="ci-desc">${it.label}</div>
          <button class="ci-info" onclick="toggleDesc('${it.id}',event)">ℹ</button>
        </div>
        <div class="ci-full-desc" id="desc_${it.id}">${it.desc}</div>
        <div class="ci-btns">
          <button class="ci-btn btn-safe ${r?.result==='safe'?'selected':''}" onclick="setResult('${it.id}','safe')">✓ Safe</button>
          <button class="ci-btn btn-nr ${r?.result==='nr'?'selected':''}" onclick="setResult('${it.id}','nr')">— N/O</button>
          <button class="ci-btn btn-ar ${r?.result==='ar'?'selected':''}" onclick="setResult('${it.id}','ar')">⚠ At Risk</button>
          <button class="ci-btn btn-na ${r?.result==='na'?'selected':''}" onclick="setResult('${it.id}','na')">N/A</button>
        </div>
        <div class="ci-comment" id="cmt_${it.id}">
          <textarea placeholder="Describe the at-risk behavior and immediate action taken..."
            onchange="setComment('${it.id}',this.value)">${r?.comment||''}</textarea>
        </div>
      </div>`;
    });
  });
  scroll.innerHTML = html;
  updateCatProgress();
  
  // Show footer form
  initFooterSummary();
}

function setResult(id, result) {
  results[id] = {result, comment: results[id]?.comment || ''};
  const ci = document.getElementById('ci_'+id);
  if (ci) {
    ci.className = 'ci ' + result;
    ci.querySelectorAll('.ci-btn').forEach(b => b.classList.remove('selected'));
    ci.querySelector('.btn-'+result)?.classList.add('selected');
    const cmt = document.getElementById('cmt_'+id);
    if (cmt) cmt.style.display = result === 'ar' ? 'block' : 'none';
  }
  updateStats();
  updateCatProgress();
}

function setComment(id, val) {
  if (results[id]) results[id].comment = val;
}

// ══ STATS ═════════════════════════════════════════════
function updateStats() {
  const items = currentApproach === 'one' ? ONE_ITEMS : TWO_ITEMS;
  let safe=0, nr=0, ar=0, rem=0;
  items.forEach(it => {
    const r = results[it.id];
    if (!r) rem++;
    else if (r.result==='safe') safe++;
    else if (r.result==='nr') nr++;
    else if (r.result==='ar') ar++;
    // na: scored but excluded from compliance denominator
  });
  document.getElementById('stat_safe').textContent = safe;
  document.getElementById('stat_nr').textContent   = nr;
  document.getElementById('stat_ar').textContent   = ar;
  document.getElementById('stat_rem').textContent  = rem;
  const scored = safe + nr + ar;
  const total  = items.length;
  const compRate = scored > 0 ? Math.round(safe / scored * 100) : null;
  document.getElementById('stat_pct').textContent = compRate !== null ? compRate+'%' : '—';
  document.getElementById('pbar_fill').style.width = Math.round(scored/total*100)+'%';
}

function updateCatProgress() {
  const items = currentApproach === 'one' ? ONE_ITEMS : TWO_ITEMS;
  const catMap = {};
  items.forEach(it => {
    if (!catMap[it.cat]) catMap[it.cat] = {total:0,scored:0};
    catMap[it.cat].total++;
    if (results[it.id]) catMap[it.cat].scored++;
  });
  Object.entries(catMap).forEach(([cat,{total,scored}]) => {
    const el = document.getElementById('catp_'+cat);
    if (el) {
      el.textContent = `${scored}/${total}`;
      el.className = 'ch-prog' + (scored===total?' done':'');
    }
  });
}

// ══ ARCHIVE MODAL ══════════════════════════════════════
function openArchiveModal() {
  const g = id => (document.getElementById(id)?.value||'').trim();
  const items = currentApproach === 'one' ? ONE_ITEMS : TWO_ITEMS;
  let safe=0,nr=0,ar=0,na=0;
  const atRiskItems = [];
  items.forEach(it => {
    const r = results[it.id];
    if (!r) return;
    if (r.result==='safe') safe++;
    else if (r.result==='nr') nr++;
    else if (r.result==='ar') { ar++; atRiskItems.push({...it, comment:r.comment}); }
    else if (r.result==='na') na++;
  });
  const scored = safe+nr+ar;
  const compliance = scored > 0 ? Math.round(safe/scored*100) : 0;
  
  const now = new Date();
  pendingRecord = {
    id: Date.now()+'_'+Math.random().toString(36).slice(2,5),
    type: 'sqor',
    device_id: getDeviceId(),
    archived_at: now.toISOString(),
    app_version: '1.0',
    date: now.toISOString().slice(0,10),
    time: String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),
    galley_position: currentGalley,
    unit: '1401 GG Toronto',
    driver_employee_id: window._driverEmployeeId || '',
    driver_role: window._driverRole || '',
    guide_employee_id: window._guideEmployeeId || '',
    truck_num: g('h_truck'),
    driver_name: g('h_driver'),
    guide_name: g('h_guide'),
    airline: g('h_airline'),
    aircraft_num: g('h_aircraft_num'),
    aircraft_type: g('h_aircraft_type'),
    approach_type: currentApproach,
    observer_name: g('f_observer'),
    observer_title: g('f_title'),
    sqor_observed: document.querySelector('input[name="sqor_obs"]:checked')?.value || '',
    immediate_feedback: g('f_feedback'),
    comments: g('f_comments'),
    safe_count: safe,
    na_count: na,
    not_observed_count: nr,
    at_risk_count: ar,
    scored_count: scored,
    total_items: items.length,
    compliance_rate: compliance,
    items: items.map(it => {
      const r = results[it.id] || {result:'',comment:''};
      return {
        item_id: it.id, label: it.label, category: it.cat,
        result: r.result, comment: r.comment,
        reda_primary: it.reda1, reda_secondary: it.reda2
      };
    }),
    at_risk_items: atRiskItems.map(it => ({
      item_id: it.id, label: it.label, category: it.cat,
      comment: it.comment, reda_primary: it.reda1, reda_secondary: it.reda2
    })),
  };

  // Build preview
  const rows = [
    ['Galley Position', currentGalley ? {'fwd':'Forward','mid':'Mid','mid2':'Mid 2','aft':'Aft'}[currentGalley] : '— Not selected'],
    ['Date / Time', pendingRecord.date + ' ' + pendingRecord.time],
    ['Truck #', pendingRecord.truck_num || '—'],
    ['Driver', pendingRecord.driver_name || '—'],
    ['Airline', pendingRecord.airline || '—'],
    ['Aircraft', pendingRecord.aircraft_num + ' (' + pendingRecord.aircraft_type + ')'],
    ['Approach', currentApproach === 'one' ? 'One Person' : 'Two Person'],
    ['Safe', safe + ' items'],
    ['Not Observed', nr + ' items'],
    ['At Risk', ar + ' items'],
    ['N/A (excluded)', na + ' items'],
    ['Compliance Rate', compliance + '%'],
    ['Observer', pendingRecord.observer_name],
  ];

  let html = rows.map(([l,v]) => `<div class="arc-row"><span class="ar-lbl">${l}</span><span class="ar-val">${v}</span></div>`).join('');
  
  if (atRiskItems.length) {
    html += `<div class="arc-atrisk-list"><div style="font-size:11px;font-weight:700;color:var(--atrisk);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">⚠ At-Risk Behaviors</div>`;
    html += atRiskItems.map(it => `<div class="arc-ar-item"><div class="aai-lbl">${it.label}</div><div class="aai-comment">${it.comment || 'No comment recorded'}</div><div style="font-size:10px;color:#888;margin-top:3px">REDA: ${it.reda1}${it.reda2?' · '+it.reda2:''}</div></div>`).join('');
    html += '</div>';
  }

  document.getElementById('arc_preview').innerHTML = html;
  document.getElementById('archiveModal').classList.add('show');
}

function closeModal(e) {
  if (!e || e.target===document.getElementById('archiveModal'))
    document.getElementById('archiveModal').classList.remove('show');
}

function confirmArchive() {
  if (!pendingRecord) return;
  const arr = getSqorArchive();
  arr.push(pendingRecord);
  localStorage.setItem('gw_sqor_archive', JSON.stringify(arr));
  document.getElementById('archiveModal').classList.remove('show');
  showToast('✅ SQOR archived — ' + arr.length + ' total');
  pendingRecord = null;
  updateHomeCount();
}

function getSqorArchive() {
  try { return JSON.parse(localStorage.getItem('gw_sqor_archive')||'[]'); } catch(e) { return []; }
}
function getDeviceId() {
  let id = localStorage.getItem('gw_device_id');
  if (!id) { id='dev_'+Date.now()+'_'+Math.random().toString(36).slice(2,7); localStorage.setItem('gw_device_id',id); }
  return id;
}
function updateHomeCount() {
  const n = getSqorArchive().length;
  document.getElementById('app_sub').textContent = `Gate Gourmet YYZ · ${n} SQOR${n!==1?'s':''} archived`;
}

// ══ RESET ════════════════════════════════════════════
function resetForm() {
  if (!confirm('Reset this SQOR? All entries will be cleared.')) return;
  results = {};
  renderChecklist();
  updateStats();
  ['h_truck','h_driver','h_guide','f_comments'].forEach(id => {
    const el = document.getElementById(id); if(el) el.value='';
  });
  ['h_airline','h_aircraft_num','h_aircraft_type'].forEach(id => {
    const el = document.getElementById(id); if(el) el.value='';
  });
}
