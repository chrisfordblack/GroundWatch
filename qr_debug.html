<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GroundWatch QR Diagnostics</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  background:#0D1117;color:#E6EDF3;padding:16px;font-size:14px}
h1{font-size:18px;font-weight:700;color:#48AF44;margin-bottom:4px}
.sub{font-size:12px;color:#8B949E;margin-bottom:20px}
.test{background:#161B22;border:1px solid #30363D;border-radius:10px;
  padding:12px 14px;margin-bottom:10px}
.test-title{font-size:13px;font-weight:700;margin-bottom:6px}
.result{font-size:12px;font-family:monospace;padding:6px 10px;border-radius:6px;
  margin-top:4px;word-break:break-all;line-height:1.6}
.pass{background:rgba(46,160,67,.15);color:#2EA043}
.fail{background:rgba(218,54,51,.15);color:#DA3633}
.warn{background:rgba(210,153,34,.15);color:#D29922}
.info{background:rgba(31,111,235,.15);color:#58A6FF}
.btn{width:100%;background:#48AF44;color:#fff;border:none;border-radius:8px;
  padding:14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;
  margin-bottom:10px}
.btn-blue{background:#1F6FEB}
video{width:100%;border-radius:8px;margin-top:8px;background:#000;display:none}
#qr_raw_out{font-family:monospace;font-size:13px;padding:10px;
  background:rgba(255,255,255,.05);border-radius:6px;margin-top:8px;
  word-break:break-all;min-height:40px;color:#58A6FF}
</style>
</head>
<body>
<h1>GroundWatch QR Diagnostics</h1>
<p class="sub">Runs automatically. Share results with Claude.</p>

<div id="results"></div>

<button class="btn" onclick="testCamera()">▶ Test Live Camera</button>
<video id="test_video" autoplay playsinline muted></video>
<div id="cam_status" style="font-size:12px;color:#8B949E;margin-top:6px"></div>

<div class="test" style="margin-top:10px">
  <div class="test-title">📷 Scan QR from live camera</div>
  <button class="btn btn-blue" onclick="startScan()" id="scan_btn" style="margin-top:8px;margin-bottom:0" disabled>Start Scanning</button>
  <div id="scan_status" style="font-size:12px;color:#8B949E;margin-top:6px">Start camera first</div>
  <div id="qr_raw_out">QR result will appear here</div>
</div>

<script>
const R = document.getElementById('results');

function add(title, text, cls) {
  const d = document.createElement('div');
  d.className = 'test';
  d.innerHTML = `<div class="test-title">${title}</div><div class="result ${cls}">${text}</div>`;
  R.appendChild(d);
}

// ── RUN DIAGNOSTICS ───────────────────────────────────────────
function runTests() {
  // 1. User agent
  add('Browser / OS', navigator.userAgent.slice(0,120), 'info');

  // 2. HTTPS
  const isHttps = location.protocol === 'https:';
  add('Protocol', location.protocol + '//' + location.host + location.pathname,
    isHttps ? 'pass' : 'fail');

  // 3. mediaDevices API
  const hasMedia = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  add('navigator.mediaDevices.getUserMedia',
    hasMedia ? '✅ Available' : '❌ Not available — camera will not work',
    hasMedia ? 'pass' : 'fail');

  // 4. BarcodeDetector
  const hasBD = 'BarcodeDetector' in window;
  add('BarcodeDetector API',
    hasBD ? '✅ Available (native QR scanning)' : '⚠ Not available — will use jsQR fallback',
    hasBD ? 'pass' : 'warn');

  // 5. jsQR
  // Load it dynamically to test CDN
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js';
  s.onload  = () => add('jsQR from CDN', '✅ Loaded successfully', 'pass');
  s.onerror = () => add('jsQR from CDN', '❌ Failed to load — CDN blocked or no network', 'fail');
  document.head.appendChild(s);

  // 6. createImageBitmap
  const hasCIB = typeof createImageBitmap !== 'undefined';
  add('createImageBitmap', hasCIB ? '✅ Available' : '❌ Not available', hasCIB ? 'pass' : 'fail');

  // 7. AudioContext
  const hasAudio = !!(window.AudioContext || window.webkitAudioContext);
  add('AudioContext', hasAudio ? '✅ Available' : '⚠ Not available', hasAudio ? 'pass' : 'warn');

  // 8. Permissions API
  if (navigator.permissions) {
    navigator.permissions.query({ name: 'camera' })
      .then(r => add('Camera Permission', '🔒 State: ' + r.state, r.state === 'granted' ? 'pass' : 'warn'))
      .catch(e => add('Camera Permission', '⚠ Query failed: ' + e.message, 'warn'));
  } else {
    add('Camera Permission', '⚠ Permissions API not available', 'warn');
  }

  // 9. Enumerate cameras
  if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
    navigator.mediaDevices.enumerateDevices()
      .then(devices => {
        const cams = devices.filter(d => d.kind === 'videoinput');
        const labels = cams.map((c,i) => (c.label || 'Camera ' + (i+1)) + (c.label && c.label.toLowerCase().includes('back') ? ' ← REAR' : c.label && c.label.toLowerCase().includes('front') ? ' ← FRONT' : '')).join(' | ');
        add('Cameras found', cams.length + ' camera(s): ' + (labels || 'Labels hidden until permission granted'), cams.length > 0 ? 'pass' : 'fail');
      })
      .catch(e => add('Camera enumeration', '⚠ ' + e.message, 'warn'));
  }
}

// ── CAMERA TEST ────────────────────────────────────────────────
let stream = null;
function testCamera() {
  const video = document.getElementById('test_video');
  const status = document.getElementById('cam_status');
  status.textContent = 'Requesting camera...';

  // Try exact rear camera
  navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: 'environment' } } })
    .catch(() => navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }))
    .catch(() => navigator.mediaDevices.getUserMedia({ video: true }))
    .then(s => {
      stream = s;
      video.style.display = 'block';
      video.srcObject = s;
      video.play();
      const track = s.getVideoTracks()[0];
      const settings = track.getSettings();
      status.innerHTML = `✅ Camera: <strong>${track.label || 'unnamed'}</strong><br>` +
        `facingMode: ${settings.facingMode || 'unknown'} | ` +
        `${settings.width}×${settings.height}`;
      document.getElementById('scan_btn').disabled = false;
      document.getElementById('scan_status').textContent = 'Camera ready — tap Start Scanning';
    })
    .catch(err => {
      status.textContent = '❌ ' + err.name + ': ' + err.message;
    });
}

// ── QR SCAN TEST ───────────────────────────────────────────────
let scanning = false;
function startScan() {
  scanning = true;
  document.getElementById('scan_status').textContent = '🟢 Scanning — hold QR code in front of camera';
  document.getElementById('scan_btn').textContent = 'Scanning...';
  document.getElementById('scan_btn').disabled = true;
  scanLoop();
}

function scanLoop() {
  if (!scanning) return;
  const video = document.getElementById('test_video');
  if (!video || video.readyState < 2) { requestAnimationFrame(scanLoop); return; }

  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0);

  // Try BarcodeDetector
  if ('BarcodeDetector' in window) {
    new BarcodeDetector({ formats: ['qr_code'] }).detect(canvas)
      .then(hits => {
        if (hits.length) { onFound(hits[0].rawValue, 'BarcodeDetector'); return; }
        requestAnimationFrame(scanLoop);
      })
      .catch(() => tryJsQR(ctx, canvas));
    return;
  }
  tryJsQR(ctx, canvas);
}

function tryJsQR(ctx, canvas) {
  if (typeof jsQR === 'undefined') { requestAnimationFrame(scanLoop); return; }
  const px = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const code = jsQR(px.data, px.width, px.height);
  if (code) { onFound(code.data, 'jsQR'); return; }
  requestAnimationFrame(scanLoop);
}

function onFound(raw, method) {
  scanning = false;
  if (navigator.vibrate) navigator.vibrate([100,50,100]);
  document.getElementById('scan_status').textContent = '✅ QR detected via ' + method;
  document.getElementById('qr_raw_out').textContent = 'RAW: ' + raw;
  document.getElementById('scan_btn').textContent = 'Scan Again';
  document.getElementById('scan_btn').disabled = false;
  document.getElementById('scan_btn').onclick = () => {
    scanning = true;
    document.getElementById('scan_status').textContent = '🟢 Scanning...';
    document.getElementById('scan_btn').disabled = true;
    scanLoop();
  };
}

runTests();
</script>
</body>
</html>
